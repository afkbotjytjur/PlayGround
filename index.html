<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Vice County — Open City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1020;font-family:Impact,"Arial Black",system-ui;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px 0 #111}#brand{position:absolute;left:22px;top:18px;font-size:18px;letter-spacing:2px;color:#f5df70}#brand span{display:block;color:#43d9ff;font-size:12px}#stats{position:absolute;right:24px;top:18px;text-align:right;font-family:Arial;font-weight:800}#money{color:#72f5a3;font-size:23px}.bar{width:150px;height:8px;background:#1b1b27;margin-top:7px}.bar i{display:block;height:100%;background:#7de6ff;width:100%}#wanted{position:absolute;right:24px;top:78px;color:#ff6b6b;font-size:22px;letter-spacing:5px}
#mission{position:absolute;left:22px;bottom:34px;max-width:min(420px,52vw);background:rgba(7,11,24,.88);border-left:5px solid #f2b84b;padding:10px 14px;font-family:Arial;font-size:14px;line-height:1.35}#mission b{color:#f7cf66;font-size:17px}#objective{position:absolute;left:22px;bottom:112px;font-family:Arial;font-weight:800;background:rgba(12,18,34,.8);padding:8px 12px}
#controls{position:absolute;inset:0;display:none;pointer-events:none}.control{pointer-events:auto;position:absolute;border:2px solid rgba(255,255,255,.32);background:rgba(12,18,34,.42);border-radius:50%;width:62px;height:62px;font:25px/62px Arial;text-align:center;user-select:none}#up{left:36px;bottom:98px}#down{left:36px;bottom:25px}#left{left:0;bottom:62px}#right{left:72px;bottom:62px}#action{right:25px;bottom:38px;width:76px;height:76px;line-height:76px;border-color:#f2b84b}#brake{right:112px;bottom:38px;width:58px;height:58px;line-height:58px}
#start{position:absolute;inset:0;background:linear-gradient(135deg,rgba(14,20,38,.7),rgba(27,18,50,.82));display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}#startCard{width:min(560px,82vw)}#title{font-size:clamp(54px,10vw,110px);line-height:.78;letter-spacing:-4px;transform:skew(-8deg);color:#f4dca0;text-shadow:5px 6px 0 #9b4b84,9px 10px 0 #16182b}#subtitle{color:#55dfe6;letter-spacing:8px;font-size:clamp(12px,2vw,19px);margin-top:20px}#play{margin-top:38px;border:0;background:#e8b84c;color:#171827;font-weight:900;font-size:20px;padding:15px 38px;cursor:pointer;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}#hint{margin-top:18px;font-family:Arial;color:#d8d9e6;font-size:13px}
@media(pointer:coarse){#controls{display:block}#mission{bottom:145px}#objective{bottom:225px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud"><div id="brand">VICE COUNTY<span>OPEN CITY</span></div><div id="stats"><div id="money">$000250</div><div class="bar"><i id="health"></i></div></div><div id="wanted">★☆☆☆☆</div><div id="objective"></div><div id="mission"><b>WELCOME TO PALM HEIGHTS</b><br><span id="missionText">Steal a ride and reach the marina.</span></div></div>
<div id="controls"><div id="up" class="control">▲</div><div id="left" class="control">◀</div><div id="right" class="control">▶</div><div id="down" class="control">▼</div><div id="brake" class="control">Ⅱ</div><div id="action" class="control">A</div></div>
<div id="start"><div id="startCard"><div id="title">VICE<br>COUNTY</div><div id="subtitle">OPEN CITY</div><button id="play">ENTER THE CITY</button><div id="hint">WASD / ARROWS to drive • E to enter or exit • SPACE for handbrake</div></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},world={w:2400,h:2400},camera={x:1200,y:1200};const player={x:1200,y:1200,a:-Math.PI/2,speed:0,w:24,h:46,car:null,money:250,health:100,wanted:0};
const buildings=[],cars=[],trees=[];const marina={x:2280,y:2280};let missionDone=false,started=false,last=performance.now();
const r=(a,b)=>a+Math.random()*(b-a);
for(let gx=120;gx<world.w;gx+=300)for(let gy=120;gy<world.h;gy+=300){let b={x:gx+r(-40,40),y:gy+r(-40,40),w:r(145,220),h:r(145,220),c:['#3d4f67','#4b4664','#5a4a43','#365b62'][Math.floor(Math.random()*4)]};buildings.push(b)}
function makeCar(){return{x:r(80,2320),y:r(80,2320),a:Math.random()<.5?0:Math.PI/2,v:r(35,90),traffic:true,c:['#e86b5b','#4dc2ca','#e6c85c','#b667bb','#5e9fe0','#e9edf2'][Math.floor(Math.random()*6)]}}for(let i=0;i<55;i++)cars.push(makeCar());for(let i=0;i<130;i++)trees.push({x:r(20,2380),y:r(20,2380),r:r(8,16)});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let touch={up:false,down:false,left:false,right:false,brake:false};
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.prevent.preventDefault();el.setPointerCapture(e.pointerId);touch[key]=true});el.addEventListener('pointerup',()=>touch[key]=false);el.addEventListener('pointercancel',()=>touch[key]=false)}bind('up','up');bind('down','down');bind('left','left');bind('right','right');bind('brake','brake');document.getElementById('action').addEventListener('pointerdown',action);
function action(){if(!started)return;if(player.car){player.x=player.car.x+25;player.y=player.car.y;player.car=null;return}let best=null,bd=44;for(const car of cars){let d=Math.hypot(car.x-player.x,car.y-player.y);if(d<bd){bd=d;best=car}}if(best){player.car=best;player.wanted=Math.max(player.wanted,1)}}
document.getElementById('play').onclick=()=>{started=true;document.getElementById('start').style.display='none';document.getElementById('objective').textContent='OBJECTIVE: Reach the marina'};
function rectCar(b,c){let px=Math.max(b.x-b.w/2,Math.min(c.x,b.x+b.w/2)),py=Math.max(b.y-b.h/2,Math.min(c.y,b.y+b.h/2));return (c.x-px)**2+(c.y-py)**2<25*25}
function update(dt){if(!started)return;let up=keys.w||keys.arrowup||touch.up,down=keys.s||keys.arrowdown||touch.down,left=keys.a||keys.arrowleft||touch.left,right=keys.d||keys.arrowright||touch.right,brake=keys[' ']||touch.brake;
if(player.car){let car=player.car;if(up)car.v=Math.min(car.v+220*dt,390);if(down)car.v=Math.max(car.v-300*dt,-130);if(!up&&!down)car.v*=Math.pow(.985,dt*60);if(brake)car.v*=Math.pow(.94,dt*60);if(left&&Math.abs(car.v)>8)car.a-=2.1*dt*(car.v>=0?1:-1);if(right&&Math.abs(car.v)>8)car.a+=2.1*dt*(car.v>=0?1:-1);car.x+=Math.sin(car.a)*car.v*dt;car.y-=Math.cos(car.a)*car.v*dt;car.x=Math.max(30,Math.min(world.w-30,car.x));car.y=Math.max(30,Math.min(world.h-30,car.y));if(buildings.some(b=>rectCar(b,car))){car.v*=-.25}player.x=car.x;player.y=car.y}else{let dx=(right?1:0)-(left?1:0),dy=(down?1:0)-(up?1:0),n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;player.x=Math.max(15,Math.min(world.w-15,player.x+dx*190*dt));player.y=Math.max(15,Math.min(world.h-15,player.y+dy*190*dt));if(dx||dy)player.a=Math.atan2(dx,-dy)}camera.x+=(player.x-camera.x)*Math.min(1,dt*5);camera.y+=(player.y-camera.y)*Math.min(1,dt*5);
for(const car of cars){if(car===player.car)continue;car.x+=Math.sin(car.a)*car.v*dt;car.y-=Math.cos(car.a)*car.v*dt;if(car.x<30)car.x=2370;if(car.x>2370)car.x=30;if(car.y<30)car.y=2370;if(car.y>2370)car.y=30}
if(!missionDone&&player.car&&Math.hypot(player.x-marina.x,player.y-marina.y)<170){missionDone=true;player.money+=1500;document.getElementById('missionText').textContent='Chase complete! Your cash and reputation are up.';document.getElementById('objective').textContent='MISSION COMPLETE';setTimeout(()=>document.getElementById('objective').textContent='FREE ROAM',4000)}}
function draw(){ctx.fillStyle='#182132';ctx.fillRect(-W,-H,world.w+W*2,world.h+H*2);for(let g=0;g<world.w;g+=300){ctx.fillStyle='#404b59';ctx.fillRect(g-72,-100,144,world.h+200)}for(let g=0;g<world.h;g+=300){ctx.fillStyle='#404b59';ctx.fillRect(-100,g-72,world.w+200,144)}ctx.setLineDash([18,18]);ctx.strokeStyle='#77808b';ctx.lineWidth=3;for(let g=150;g<world.w;g+=300){ctx.beginPath();ctx.moveTo(g,-100);ctx.lineTo(g,world.h+100);ctx.stroke()}for(let g=150;g<world.h;g+=300){ctx.beginPath();ctx.moveTo(-100,g);ctx.lineTo(world.w+100,g);ctx.stroke()}ctx.setLineDash([]);
for(const b of buildings){ctx.fillStyle='#151827';ctx.fillRect(b.x-b.w/2+12,b.y-b.h/2+14,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.fillStyle='rgba(255,218,126,.34)';for(let wx=b.x-b.w/2+18;wx<b.x+b.w/2-10;wx+=34)for(let wy=b.y-b.h/2+18;wy<b.y+b.h/2-10;wy+=34)ctx.fillRect(wx,wy,16,12)}for(const t of trees){ctx.fillStyle='#244f3b';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.fillStyle='#397957';ctx.beginPath();ctx.arc(t.x-3,t.y-3,t.r*.7,0,7);ctx.fill()}ctx.fillStyle='#4e8ca1';ctx.fillRect(2200,2200,200,200);for(let i=0;i<4;i++){ctx.fillStyle='#eae6d5';ctx.fillRect(2230+i*42,2240,28,70)}
ctx.fillStyle='#f2b84b';ctx.beginPath();ctx.arc(marina.x,marina.y,26,0,7);ctx.fill();for(const car of cars){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-12,-19,25,49);ctx.fillStyle=car.c;ctx.fillRect(-12,-24,24,48);ctx.fillStyle='#1a2638';ctx.fillRect(-9,-16,18,16);ctx.fillStyle='#dceaff';ctx.fillRect(-8,-27,6,4);ctx.fillRect(2,-27,6,4);ctx.restore()}if(!player.car){ctx.fillStyle='#f2c43d';ctx.beginPath();ctx.arc(player.x,player.y,13,0,7);ctx.fill();ctx.fillStyle='#24263b';ctx.fillRect(player.x-7,player.y-7,14,18)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2-camera.x,H/2-camera.y);update(dt);draw();ctx.restore();document.getElementById('money').textContent='$'+String(player.money).padStart(6,'0');document.getElementById('wanted').textContent='★'.repeat(player.wanted)+'☆'.repeat(5-player.wanted);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
